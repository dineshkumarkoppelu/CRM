# Tool configuration only (the API is not packaged as a library).

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run so the async Neo4j driver is never shared across loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# One-off diagnostic script with a dense table of query specs and report lines.
"scripts/profile_queries.py" = ["E501"]

[tool.coverage.run]
source = ["app"]
